name: Main CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Execute Jest / Vitest Frontend Unit Tests
        run: npm run test

      - name: Verify Next.js Production Build
        run: npm run build

  contracts:
    name: Soroban Smart Contracts Compile & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Compile All Soroban Contracts to WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run Soroban Rust Unit Tests
        run: cargo test
